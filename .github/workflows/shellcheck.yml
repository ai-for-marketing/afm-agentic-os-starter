name: shellcheck

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck on every shell script
        run: |
          set -euo pipefail
          # All *.sh files plus any other tracked file whose first line is a sh/bash shebang.
          mapfile -t scripts < <(
            git ls-files -z | while IFS= read -r -d '' f; do
              [ -f "$f" ] || continue
              case "$f" in
                *.sh|*.bash) printf '%s\n' "$f" ;;
                *) head -n1 "$f" 2>/dev/null | grep -Eq '^#!.*\b(ba|da|k)?sh\b' && printf '%s\n' "$f" ;;
              esac
            done
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Checking:\n'; printf '  %s\n' "${scripts[@]}"
          shellcheck --version
          shellcheck "${scripts[@]}"
